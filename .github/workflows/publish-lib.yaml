name: Lib CI Pipeline

on:
  workflow_call:
    secrets:
      GH_TOKEN:
        required: true

jobs:
  setup-pipeline:
    runs-on: ubuntu-latest
    outputs:
      gradle-cache-key: ${{ steps.create-gradlew-cache-key.outputs.gradle-cache-key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build do Projeto
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assemble
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Executar Testes
        uses: gradle/gradle-build-action@v3
        with:
          arguments: test
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      
      - name: Publicar com Gradle
        uses: gradle/gradle-build-action@v3
        with:
          arguments: publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Create Pull Request
        id: create-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "BRANCH=$BRANCH"
          {
            PR_EXISTS=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length' 2>/dev/null || echo "0")
            if [ "$PR_EXISTS" -gt 0 ]; then
              echo "PR_EXISTS=true" >> $GITHUB_OUTPUT
              echo "PR_STATUS=exists"
              echo "ℹ️ Pull Request já existe para $BRANCH — pulando criação."
              exit 0
            fi

            COMMITS_AHEAD=$(gh pr create \
              --title "Merge from $BRANCH into master" \
              --body "Automatic merge by publish-lib.yml workflow" \
              --base master \
              --head "$BRANCH" 2>&1) || true

            if echo "$COMMITS_AHEAD" | grep -q "No commits between"; then
              echo "PR_EXISTS=false" >> $GITHUB_OUTPUT
              echo "PR_STATUS=no-commits"
              echo "⚠️ Nenhum commit novo entre master e $BRANCH — PR não criado."
            elif echo "$COMMITS_AHEAD" | grep -q "already exists"; then
              echo "PR_EXISTS=true" >> $GITHUB_OUTPUT
              echo "PR_STATUS=exists"
              echo "ℹ️ Pull Request já existe para $BRANCH — pulando criação."
            else
              echo "PR_EXISTS=false" >> $GITHUB_OUTPUT
              echo "PR_STATUS=created"
              echo "✅ Pull Request criado com sucesso."
            fi
          } || {
            echo "PR_EXISTS=false" >> $GITHUB_OUTPUT
            echo "PR_STATUS=unknown-error"
            echo "❌ Erro inesperado ao criar PR: $(echo "$COMMITS_AHEAD" | head -1)"
          }
    
      - name: Gerar Resumo do Workflow
        env:
          PR_STATUS: ${{ steps.create-pr.outputs.PR_STATUS }}
        run: |
          echo "## 🚀 Relatório do Workflow" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa  | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          case "$PR_STATUS" in
            created)
              echo "| Create-PR | ✅ Sucesso |" >> $GITHUB_STEP_SUMMARY
              ;;
            exists)
              echo "| Create-PR | ⚠️ Já existia — pulado |" >> $GITHUB_STEP_SUMMARY
              ;;
            no-commits)
              echo "| Create-PR | ⏭️ Sem commits novos — pulado |" >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "| Create-PR | ❌ Erro: $PR_STATUS |" >> $GITHUB_STEP_SUMMARY
              ;;
          esac